name: Sitecontrole

# Blokkeert een merge zodra er weer een noindex, een verkeerde canonical,
# een kapotte interne link of een gat in de sitemap in de site sluipt.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  controleren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check.py
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/affiliate-tracking.test.cjs
      - run: node tests/impact.test.cjs
      - run: node tests/impact-ui.test.cjs
